<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640">
<!-- README hero, animated with CSS. Template: scripts/docs-images.mjs fills in the {{…}} fields (fonts, icon and
     the latest phone screenshots) and writes docs/images/hero.svg + a still hero.jpg. -->
<style>
  @font-face { font-family: 'Serif4'; font-weight: 200 900; src: url(data:font/woff2;base64,{{SERIF}}) format('woff2'); }
  @font-face { font-family: 'JBMono'; font-weight: 500; src: url(data:font/woff2;base64,{{MONO}}) format('woff2'); }
  .serif { font-family: 'Serif4', Georgia, serif; }
  .mono { font-family: 'JBMono', ui-monospace, Menlo, Consolas, monospace; font-weight: 500; }
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .float { animation: float 7s ease-in-out infinite; }
  .float.b { animation-duration: 8s; animation-delay: -3s; }
  .glow { animation: glow 9s ease-in-out infinite; }
  .toast { animation: toast 8s ease-in-out 1.6s infinite both; }
  .ask { animation: ask 8s linear 1.6s infinite both; }
  .done { animation: done 8s linear 1.6s infinite both; }
  .press { animation: press 8s ease-in-out 1.6s infinite both; transform-origin: 1196px 66px; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 806px 616px; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes glow { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-18px); } 6%, 72% { opacity: 1; transform: none; } 78%, 100% { opacity: 0; transform: translateY(-18px); } }
  @keyframes ask { 0%, 44% { opacity: 1; } 47%, 100% { opacity: 0; } }
  @keyframes done { 0%, 44% { opacity: 0; } 47%, 100% { opacity: 1; } }
  @keyframes press { 0%, 38% { transform: none; } 41% { transform: scale(.9); } 44%, 100% { transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.4); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <radialGradient id="gA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d97757" stop-opacity=".34"/><stop offset="1" stop-color="#d97757" stop-opacity="0"/></radialGradient>
  <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6f7bc8" stop-opacity=".26"/><stop offset="1" stop-color="#6f7bc8" stop-opacity="0"/></radialGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3936"/><stop offset=".6" stop-color="#252421"/></linearGradient>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  <mask id="dotMask"><rect width="1280" height="640" fill="url(#fade)"/></mask>
  <clipPath id="s1"><rect x="782" y="130" width="210" height="454" rx="27"/></clipPath>
  <clipPath id="s2"><rect x="1012" y="80" width="236" height="511" rx="30"/></clipPath>
  <clipPath id="ic"><rect x="80" y="112" width="72" height="72" rx="18"/></clipPath>
  <clipPath id="ic2"><rect x="928" y="40" width="34" height="34" rx="9"/></clipPath>
  <filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000" flood-opacity=".6"/></filter>
</defs>

<rect width="1280" height="640" rx="24" fill="#1a1918"/>
<g class="glow"><circle cx="1010" cy="330" r="430" fill="url(#gA)"/></g>
<circle cx="40" cy="640" r="380" fill="url(#gB)"/>
<rect width="1280" height="640" fill="url(#dots)" mask="url(#dotMask)"/>

<!-- text -->
<g class="rise" style="animation-delay:.05s">
  <image href="{{ICON}}" x="80" y="112" width="72" height="72" clip-path="url(#ic)"/>
  <text x="172" y="166" class="serif" font-size="54" font-weight="600" fill="#f5f4ef" letter-spacing="-1.4">snugcode</text>
</g>
<g class="rise" style="animation-delay:.2s">
  <text x="78" y="276" class="serif" font-size="56" font-weight="500" fill="#f5f4ef" letter-spacing="-1.2">Your coding agent,</text>
  <text x="78" y="342" class="serif" font-size="56" font-weight="500" fill="#f5f4ef" letter-spacing="-1.2">in your <tspan fill="#d97757" font-weight="600">pocket.</tspan></text>
</g>
<g class="rise sans" style="animation-delay:.35s" font-size="19" fill="#a5a39b">
  <text x="80" y="398">A real coding agent runs on your PC or a free cloud runner.</text>
  <text x="80" y="426">Steer it from your phone: approve diffs, preview, ship PRs.</text>
</g>
<g class="mono" font-size="13">
  <g class="rise" style="animation-delay:.5s"><rect x="80" y="466" width="270" height="34" rx="17" fill="#d97757"/><text x="215" y="488" text-anchor="middle" fill="#1f1e1d">Claude · GPT · Gemini · any key</text></g>
  <g class="rise" style="animation-delay:.58s"><rect x="360" y="466" width="129" height="34" rx="17" fill="#2a2926" stroke="#3d3b37"/><text x="424.5" y="488" text-anchor="middle" fill="#c3c1b8">E2E encrypted</text></g>
  <g class="rise" style="animation-delay:.66s"><rect x="499" y="466" width="114" height="34" rx="17" fill="#2a2926" stroke="#3d3b37"/><text x="556" y="488" text-anchor="middle" fill="#c3c1b8">Open source</text></g>
  <g class="rise" style="animation-delay:.74s"><rect x="80" y="510" width="168" height="34" rx="17" fill="#2a2926" stroke="#3d3b37"/><text x="164" y="532" text-anchor="middle" fill="#c3c1b8">No port forwarding</text></g>
  <g class="rise" style="animation-delay:.82s"><rect x="258" y="510" width="184" height="34" rx="17" fill="#2a2926" stroke="#3d3b37"/><text x="350" y="532" text-anchor="middle" fill="#c3c1b8">Worktree per session</text></g>
  <g class="rise" style="animation-delay:.9s"><rect x="452" y="510" width="153" height="34" rx="17" fill="#2a2926" stroke="#3d3b37"/><text x="528.5" y="532" text-anchor="middle" fill="#c3c1b8">Phone + terminal</text></g>
</g>

<!-- phones -->
<g class="rise" style="animation-delay:.3s"><g class="float b">
  <rect x="774" y="122" width="226" height="470" rx="35" fill="url(#frame)" stroke="#4d4a45" filter="url(#sh)"/>
  <image href="{{HOME}}" x="782" y="130" width="210" height="454" preserveAspectRatio="xMidYMin slice" clip-path="url(#s1)"/>
</g></g>
<g class="rise" style="animation-delay:.45s"><g class="float">
  <rect x="1004" y="72" width="252" height="527" rx="38" fill="url(#frame)" stroke="#4d4a45" filter="url(#sh)"/>
  <image href="{{SESSION}}" x="1012" y="80" width="236" height="511" preserveAspectRatio="xMidYMin slice" clip-path="url(#s2)"/>
</g></g>

<!-- "PC online" chip under the phones -->
<g class="rise mono" style="animation-delay:.7s" font-size="12">
  <rect x="788" y="602" width="198" height="28" rx="14" fill="#1f1e1d" stroke="#3d3b37"/>
  <circle class="pulse" cx="806" cy="616" r="5" fill="#5ee6a0"/>
  <circle cx="806" cy="616" r="4" fill="#5ee6a0"/>
  <text x="820" y="620" fill="#c3c1b8">Laptop Arfa · online</text>
</g>

<!-- notification: the agent asks, you tap Allow -->
<g class="toast">
  <rect x="916" y="28" width="330" height="76" rx="18" fill="#2c2b29" fill-opacity=".97" stroke="#4d4a45" filter="url(#sh)"/>
  <image href="{{ICON}}" x="928" y="40" width="34" height="34" clip-path="url(#ic2)"/>
  <text x="974" y="52" class="mono" font-size="11" fill="#8a887f">snugcode · now</text>
  <g class="ask">
    <text x="974" y="72" class="sans" font-size="15" font-weight="700" fill="#f5f4ef">Allow Edit?</text>
    <text x="974" y="91" class="mono" font-size="11" fill="#a5a39b">src/pages/Settings.jsx</text>
    <g class="press"><rect x="1166" y="52" width="62" height="28" rx="14" fill="#d97757"/><text x="1197" y="71" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#1f1e1d">Allow</text></g>
  </g>
  <g class="done">
    <text x="974" y="72" class="sans" font-size="15" font-weight="700" fill="#5ee6a0">✓ Allowed</text>
    <text x="974" y="91" class="mono" font-size="11" fill="#a5a39b">the agent keeps going on your PC</text>
  </g>
</g>
</svg>
