<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../web/style.css">
<style>body{font-family:'Cascadia Mono',Consolas,monospace}</style></head>
<body>
<div id="app">
  <header id="bar">
    <button class="iconbtn"><i data-ic="back"></i></button>
    <div id="title"><div id="titleRow"><span id="dot" class="on"></span><span id="titleText">PC-Rumah</span></div></div>
    <div id="actions"><button class="iconbtn"><i data-ic="dots"></i></button></div>
  </header>
  <main id="view"><div class="session"><div class="scroll"><div class="col">
    <div class="card update-banner"><span class="avatar up-avatar"><i data-ic="refresh"></i></span><span class="grow"><div class="name">Pembaruan tersedia</div><div class="sub">3 commit baru di GitHub</div></span><button class="btn-up-now">Perbarui</button></div>
    <div class="label">Sesi <span class="count">4</span><span class="tag run">1 berjalan</span></div>
    <button class="card" style="align-items:flex-start"><span class="avatar">L</span><span class="grow"><div style="display:flex;gap:8px;align-items:baseline"><div class="name" style="flex:1">Tambah dark mode di navbar</div><span class="dim small">2m</span></div><div class="sub">arfakaisar/landing</div><div class="tags"><span class="tag run">berjalan</span><span class="tag"><i data-ic="branch"></i>pocket/k3x9</span><span class="tag"><i data-ic="cpu"></i>claude-opus-5-5 · high</span></div></span></button>
    <button class="card" style="align-items:flex-start"><span class="avatar alt">A</span><span class="grow"><div style="display:flex;gap:8px;align-items:baseline"><div class="name" style="flex:1">Perbaiki test auth yang gagal</div><span class="dim small">1j</span></div><div class="sub">arfakaisar/api-server</div><div class="tags"><span class="tag"><i data-ic="term"></i>terminal</span><span class="tag"><i data-ic="branch"></i>fix/auth</span><span class="tag warn"><i data-ic="bolt"></i>auto</span></div></span></button>
    <button class="card" style="align-items:flex-start"><span class="avatar">P</span><span class="grow"><div style="display:flex;gap:8px;align-items:baseline"><div class="name" style="flex:1">Jelaskan struktur repo ini</div><span class="dim small">3h</span></div><div class="sub">arfakaisar/pocketcode</div><div class="tags"><span class="tag"><i data-ic="branch"></i>pocket/a81c</span><span class="tag"><i data-ic="cpu"></i>gemini-3.8-flash · medium</span></div></span></button>
    <button class="card" style="align-items:flex-start"><span class="avatar alt">B</span><span class="grow"><div style="display:flex;gap:8px;align-items:baseline"><div class="name" style="flex:1">Migrasi ke Vite 7</div><span class="dim small">2h</span></div><div class="sub">arfakaisar/blog</div><div class="tags"><span class="tag"><i data-ic="branch"></i>pocket/v7mg</span><span class="tag"><i data-ic="cpu"></i>claude-sonnet-5-5</span></div></span></button>
    <div style="height:80px"></div>
  </div></div>
  <button class="fab"><i data-ic="plus"></i>Sesi baru</button>
  </div></main>
</div>
<script src="mock.js"></script>
</body></html>
