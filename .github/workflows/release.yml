# Tagged releases for the "stable" update channel (daemon/updater.js): push a vX.Y.Z tag matching
# "version" in package.json, for example:
#   npm version minor   # bumps the version + commit + tag
#   git push --follow-tags
# Daemons on the stable channel only install releases (not every commit on main), and can go back to the
# previous version with `snugcode update --rollback` / the button in the app.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  # npm publish --provenance (package origin verifiable on npmjs.com)
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches the package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME ≠ package.json $v"; exit 1; fi
      - run: npm ci
      - run: npm test
      # PWA hashes built from the tagged code: compare with https://snugcode.dev/build.json (docs/security.md).
      - run: npm run build:web
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/web/build.json --title "snugcode $GITHUB_REF_NAME" --generate-notes --verify-tag
      # Publish to npm (`npm i -g snugcode`, used by the install.sh/ps1 installers) when the NPM_TOKEN secret is set.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set: skipping npm publish (installers use GitHub releases)."; exit 0; fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --provenance --access public
