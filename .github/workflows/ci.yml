name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cek sintaks semua modul
        shell: bash
        run: for f in daemon/*.js shared/*.js web/*.js relay/src/*.js scripts/*.mjs; do node --check "$f"; done
      - run: npm test
      - name: Bundle PWA
        run: npm run build:web
