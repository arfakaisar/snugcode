name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cek sintaks semua modul
        shell: bash
        run: for f in daemon/*.js shared/*.js web/*.js web/ui/*.js relay/src/*.js scripts/*.mjs test/*.mjs; do node --check "$f"; done && bash -n .devcontainer/*.sh
      - name: Type check (tsc --checkJs, termasuk relay)
        if: runner.os == 'Linux'
        run: npm ci --prefix relay && npm run typecheck
      - run: npm test
      - name: Bundle PWA
        run: npm run build:web

  # Ujung ke ujung: relay dev (wrangler) + daemon asli + Claude Agent SDK + mock 9router,
  # klien HP (web/conn.js), PWA di Chrome, dan TUI di pseudo-terminal. Tanpa key/akun asli.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm ci --prefix relay
      - run: npm run build:web
      # Sandbox OS (bubblewrap + socat) untuk Bash auto-izin engine Claude dan sandbox Codex: butuh user
      # namespace tanpa batasan AppArmor.
      - name: Siapkan sandbox OS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Jalankan relay dev
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          (cd relay && npx wrangler dev --var DEV_AUTH:1 --var TOKEN_SECRET:ci-secret --port 8787 --ip 127.0.0.1 > ../wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          cat wrangler.log; exit 1
      - run: npm run test:e2e:relay
      - run: npm run test:e2e
      - run: npm run test:e2e:cloud
      # Koneksi multi-provider: endpoint OpenAI-only lewat penerjemah (Claude Agent SDK) dan model GPT
      # lewat Codex app-server asli (sandbox bubblewrap butuh user namespace tanpa batasan AppArmor).
      - name: Siapkan Codex untuk uji koneksi
        run: |
          mkdir -p "$RUNNER_TEMP/codex" && cd "$RUNNER_TEMP/codex" && echo '{"private":true}' > package.json
          npm install --no-audit --no-fund --include=optional "$(node -p "require('$GITHUB_WORKSPACE/daemon/codex-version.json').spec")"
      - run: npm run test:e2e:connections
        env:
          SNUGCODE_E2E_CODEX: ${{ runner.temp }}/codex
      - run: npm run test:ui
        env:
          SHOTS: ${{ runner.temp }}/shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostik
          path: |
            wrangler.log
            ${{ runner.temp }}/shots
