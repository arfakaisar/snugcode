# Deploy relay + PWA ke Cloudflare (sama dengan `npm run deploy` di PC), otomatis saat main berubah
# di bagian yang ikut ter-deploy, atau manual dari tab Actions (bisa dari HP: Run workflow).
# Butuh secret repo CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"); CLOUDFLARE_ACCOUNT_ID
# opsional, hanya bila token punya akses ke lebih dari satu akun.
name: Deploy

# Hanya setelah workflow CI lulus untuk commit main itu (PWA rusak tidak pernah sampai ke HP pengguna).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Commit yang lulus CI, bukan HEAD main terbaru.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      # Dulu dibatasi `paths`: workflow_run tidak punya filter path, jadi dicek di sini.
      - name: Ada perubahan yang ikut ter-deploy?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo go=1 >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet HEAD~1 HEAD -- relay web shared scripts/build-web.mjs package-lock.json .github/workflows/deploy.yml; then echo go=0 >> "$GITHUB_OUTPUT"; else echo go=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Periksa secret Cloudflare
        if: steps.changed.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum di-set: Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
      - run: npm ci && npm ci --prefix relay
        if: steps.changed.outputs.go == '1'
      - name: npm run deploy
        if: steps.changed.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npm run deploy
      # Smoke test: relay sehat dan PWA yang disajikan = hasil build commit ini (build.json sama).
      - name: Cek versi baru aktif
        if: steps.changed.outputs.go == '1'
        run: |
          want="$(node -p "require('./relay/public/build.json').digest")"
          for i in $(seq 1 20); do
            got="$(curl -sf https://snugcode.dev/build.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).digest)}catch{}})")"
            if [ "$got" = "$want" ] && curl -sf https://snugcode.dev/api/health | grep -q wsProto; then echo "build $want aktif"; exit 0; fi
            sleep 3
          done
          echo "::error::PWA/relay yang aktif bukan build commit ini (diharapkan $want, didapat ${got:-tidak ada})"; exit 1
