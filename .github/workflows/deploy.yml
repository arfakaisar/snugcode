# Deploys the relay + PWA to Cloudflare (same as `npm run deploy` on a PC), automatically when main changes
# in deployed parts, or manually from the Actions tab (works from a phone: Run workflow).
# Needs the repo secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"); CLOUDFLARE_ACCOUNT_ID
# is optional, only when the token can access more than one account.
name: Deploy

# Only after the CI workflow passes for that main commit (a broken PWA never reaches users' phones).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that passed CI, not the latest main HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      # Used to be limited by `paths`: workflow_run has no path filter, so it is checked here.
      - name: Any deployable changes?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo go=1 >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet HEAD~1 HEAD -- relay web landing shared scripts/build-web.mjs package-lock.json .github/workflows/deploy.yml; then echo go=0 >> "$GITHUB_OUTPUT"; else echo go=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the Cloudflare secret
        if: steps.changed.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not set: Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
      - run: npm ci && npm ci --prefix relay
        if: steps.changed.outputs.go == '1'
      - name: npm run deploy
        if: steps.changed.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npm run deploy
      # Smoke test: the relay is healthy and the served PWA = this commit's build (same build.json).
      - name: Check the new version is live
        if: steps.changed.outputs.go == '1'
        run: |
          want="$(node -p "require('./relay/public/build.json').digest")"
          for i in $(seq 1 20); do
            got="$(curl -sf https://snugcode.dev/build.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).digest)}catch{}})")"
            if [ "$got" = "$want" ] && curl -sf https://snugcode.dev/api/health | grep -q wsProto; then echo "build $want aktif"; exit 0; fi
            sleep 3
          done
          echo "::error::the live PWA/relay is not this commit's build (expected $want, got ${got:-nothing})"; exit 1
