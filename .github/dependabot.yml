# The Agent SDK and Codex change fast: weekly update PRs, grouped to avoid a flood.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      agent:
        patterns: ['@anthropic-ai/*']
      other:
        patterns: ['*']
        exclude-patterns: ['@anthropic-ai/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
