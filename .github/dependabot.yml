# The Agent SDK, Codex, and wrangler change fast: weekly update PRs, grouped to avoid a flood.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      agent:
        patterns: ['@anthropic-ai/*']
      lainnya:
        patterns: ['*']
        exclude-patterns: ['@anthropic-ai/*']
  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
    groups:
      relay:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
