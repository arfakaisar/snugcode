<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#262624">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="snugcode">
  <meta name="format-detection" content="telephone=no">
  <title>snugcode agent</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <!-- Replaced with a data: URI by scripts/build-web.mjs (see the comment there). -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <div id="app">
    <header id="bar">
      <div class="side">
        <button id="back" class="iconbtn" aria-label="Back" hidden></button>
        <button id="menuBtn" class="iconbtn" aria-label="Open menu" hidden></button>
      </div>
      <button id="title" type="button" tabindex="-1">
        <span id="titleRow"><span id="dot"></span><span id="titleText">snugcode</span></span>
        <span id="subText"></span>
      </button>
      <div id="actions" class="side"></div>
    </header>
    <main id="view"></main>
  </div>
  <div id="drawer" hidden>
    <div id="drawerScrim"></div>
    <nav id="drawerPanel" aria-label="Navigation"></nav>
  </div>
  <div id="sheet" hidden>
    <div id="sheetBackdrop"></div>
    <div id="sheetPanel" role="dialog" aria-modal="true">
      <div id="sheetGrab"><span></span></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
