<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#262624">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="snugcode">
  <meta name="format-detection" content="telephone=no">
  <title>snugcode</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>try{var t=JSON.parse(localStorage.getItem('pc.theme'));if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div id="app">
    <header id="bar">
      <div class="side">
        <button id="back" class="iconbtn" aria-label="Kembali" hidden></button>
        <button id="menuBtn" class="iconbtn" aria-label="Buka menu" hidden></button>
      </div>
      <button id="title" type="button" tabindex="-1">
        <span id="titleRow"><span id="dot"></span><span id="titleText">snugcode</span></span>
        <span id="subText"></span>
      </button>
      <div id="actions" class="side"></div>
    </header>
    <main id="view"></main>
  </div>
  <div id="drawer" hidden>
    <div id="drawerScrim"></div>
    <nav id="drawerPanel" aria-label="Navigasi"></nav>
  </div>
  <div id="sheet" hidden>
    <div id="sheetBackdrop"></div>
    <div id="sheetPanel" role="dialog" aria-modal="true">
      <div id="sheetGrab"><span></span></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
